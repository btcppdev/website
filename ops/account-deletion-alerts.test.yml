rule_files:
  - account-deletion-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'btcpp_web_account_deletion_cancellation_jobs{job="btcpp",instance="stale",state="review"}'
        values: '1+0x40'
      - series: 'btcpp_web_account_deletion_cancellation_oldest_pending_timestamp_seconds{job="btcpp",instance="stale"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="stale"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="stale"}'
        values: '0+0x40'
      - series: 'btcpp_web_account_deletion_cancellation_oldest_pending_timestamp_seconds{job="btcpp",instance="empty"}'
        values: '0+0x40'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="empty"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="empty"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 21m
        alertname: BitcoinPlusPlusDeletionCancellationNeedsReview
        exp_alerts: []
      - eval_time: 21m
        alertname: BitcoinPlusPlusDeletionCancellationQueueStalled
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'btcpp_web_account_deletion_cancellation_jobs{job="btcpp",instance="web",state="review"}'
        values: '1+0x19 0+0x10'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="web"}'
        values: '1+0x30'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="web"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: BitcoinPlusPlusDeletionCancellationNeedsReview
        exp_alerts: []
      - eval_time: 10m
        alertname: BitcoinPlusPlusDeletionCancellationNeedsReview
        exp_alerts:
          - exp_labels:
              job: btcpp
              instance: web
              state: review
              severity: warning
            exp_annotations:
              summary: Deleted-account subscription cancellation needs operator review
              description: Inspect service-account-cancellations, correct the provider identity or configuration issue, then requeue the reviewed attempt.
      - eval_time: 20m
        alertname: BitcoinPlusPlusDeletionCancellationNeedsReview
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'btcpp_web_account_deletion_cancellation_jobs{job="btcpp",instance="web",state="review"}'
        values: '1+0x20'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="web"}'
        values: '0+0x20'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="web"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: BitcoinPlusPlusDeletionCancellationNeedsReview
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'btcpp_web_account_deletion_cancellation_oldest_pending_timestamp_seconds{job="btcpp",instance="web"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="web"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="web"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BitcoinPlusPlusDeletionCancellationQueueStalled
        exp_alerts: []
      - eval_time: 21m
        alertname: BitcoinPlusPlusDeletionCancellationQueueStalled
        exp_alerts:
          - exp_labels:
              job: btcpp
              instance: web
              severity: warning
            exp_annotations:
              summary: Deleted-account subscription cancellation has been pending for more than fifteen minutes
              description: Inspect service-account-cancellations and check SERVICE_STRIPE_RECONCILIATION_ENABLED and Stripe availability.
  - interval: 1m
    input_series:
      - series: 'btcpp_web_account_deletion_delivery_oldest_pending_timestamp_seconds{job="btcpp",instance="web"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="web"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="web"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BitcoinPlusPlusDeletionDeliveryQueueStalled
        exp_alerts: []
      - eval_time: 21m
        alertname: BitcoinPlusPlusDeletionDeliveryQueueStalled
        exp_alerts:
          - exp_labels:
              job: btcpp
              instance: web
              severity: warning
            exp_annotations:
              summary: Account deletion delivery has been pending for more than fifteen minutes
              description: Check ALERTS_ACCOUNT_EVENTS_ENDPOINT, the shared token and Alerts receiver availability; pending deliveries retry automatically.
  - interval: 1m
    input_series:
      - series: 'btcpp_web_account_deletion_delivery_jobs{job="btcpp",instance="stale",state="review"}'
        values: '1+0x40'
      - series: 'btcpp_web_account_deletion_delivery_oldest_pending_timestamp_seconds{job="btcpp",instance="stale"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="stale"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="stale"}'
        values: '0+0x40'
      - series: 'btcpp_web_account_deletion_delivery_oldest_pending_timestamp_seconds{job="btcpp",instance="empty"}'
        values: '0+0x40'
      - series: 'btcpp_web_business_metrics_collection_success{job="btcpp",instance="empty"}'
        values: '1+0x40'
      - series: 'btcpp_web_business_metrics_last_success_timestamp_seconds{job="btcpp",instance="empty"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 21m
        alertname: BitcoinPlusPlusDeletionCancellationNeedsReview
        exp_alerts: []
      - eval_time: 21m
        alertname: BitcoinPlusPlusDeletionDeliveryQueueStalled
        exp_alerts: []

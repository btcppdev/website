<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account screens · bitcoin++ review</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f9f6ee;color:#343638;font:16px/1.45 'IBM Plex Sans',system-ui,sans-serif}header{padding:24px 28px;border-bottom:1px solid #d7d4cc;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;letter-spacing:-.04em;margin:0}h1 em{font-family:'Source Serif 4',serif;font-weight:500}header p{font-size:14px;color:#65635e;margin:4px 0 0}.controls{display:flex;gap:8px;flex-wrap:wrap}button,.open{font:600 14px/1.3 "IBM Plex Sans",system-ui,sans-serif;border:1px solid #d7d4cc;border-radius:6px;padding:10px 14px;background:transparent;color:#343638;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#b35f00;border-color:#b35f00;color:white}button:focus-visible,a:focus-visible{outline:2px solid #b35f00;outline-offset:3px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100vh - 103px)}nav{padding:12px 16px 28px;overflow:auto;border-right:1px solid #d7d4cc}nav h2{font-size:14px;font-weight:600;margin:20px 12px 8px;color:#65635e}nav a{display:block;padding:9px 12px;margin:2px 0;border-radius:6px;text-decoration:none;color:inherit;font-size:14px;border:1px solid transparent}nav a[aria-current=page]{background:#fff0df;border-color:#db7900;color:#874800}nav a:hover{background:#fffdf8}main{min-width:0;display:flex;flex-direction:column;padding:16px 20px;overflow:auto}.screen-heading{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 12px;flex-shrink:0}.screen-heading h2{font-size:16px;font-weight:600;margin:0}.stage{flex:1;min-height:520px;display:flex;justify-content:center;align-items:stretch}iframe{display:block;background:#f9f6ee;width:100%;height:100%;min-height:520px;border:1px solid #d7d4cc;border-radius:8px}iframe.mobile{max-width:390px}small{color:#65635e;font-size:12px}@media(max-width:800px){header{padding:18px;display:block}.controls{margin-top:12px}.layout{display:block;height:auto}nav{max-height:230px;border-bottom:1px solid #d7d4cc;border-right:0}main{padding:16px 10px}.stage{height:800px;flex:auto}.screen-heading{padding:0 6px}.open{white-space:nowrap}}
</style>
</head>
<body>
<header><div><h1>Account <em>screens.</em></h1><p>{{len .}} states · Sample data · Forms disabled</p></div><div class="controls"><button type="button" id="desktop" aria-pressed="true">Desktop</button><button type="button" id="mobile" aria-pressed="false">Mobile · 390px</button><button type="button" id="refresh">Refresh preview ↻</button></div></header>
<div class="layout">
<nav aria-label="Account screen examples">
{{$group := ""}}{{range .}}{{if ne $group .Group}}<h2>{{.Group}}</h2>{{$group = .Group}}{{end}}<a href="/preview/account/{{.Slug}}" data-example="{{.Slug}}">{{.Title}}</a>{{end}}
</nav>
<main><div class="screen-heading"><h2 id="screen-title">OAuth · Example app</h2><a class="open" id="open" href="/preview/account/oauth" target="_blank" rel="noopener">Open full page ↗</a></div><div class="stage"><iframe title="Account screen preview" src="/preview/account/oauth" id="preview" sandbox="allow-scripts allow-same-origin"></iframe></div></main>
</div>
<script>
const frame=document.getElementById('preview'), links=[...document.querySelectorAll('[data-example]')];
function select(slug){const link=links.find(a=>a.dataset.example===slug)||links.find(a=>a.dataset.example==='oauth');links.forEach(a=>a.removeAttribute('aria-current'));link.setAttribute('aria-current','page');document.getElementById('screen-title').textContent=link.textContent;document.getElementById('open').href=link.href;frame.src=link.href;history.replaceState(null,'','#'+link.dataset.example)}
links.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();select(a.dataset.example)}));
select(location.hash.slice(1)||'oauth');
for(const mode of ['desktop','mobile'])document.getElementById(mode).addEventListener('click',()=>{frame.classList.toggle('mobile',mode==='mobile');for(const other of ['desktop','mobile'])document.getElementById(other).setAttribute('aria-pressed',String(other===mode))});
document.getElementById('refresh').addEventListener('click',()=>{frame.src=document.getElementById('open').href});
</script>
</body>
</html>

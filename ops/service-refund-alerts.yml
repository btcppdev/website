groups:
  - name: btcpp-service-refunds
    rules:
      - alert: BitcoinPlusPlusRefundNeedsReview
        expr: |
          (btcpp_web_service_refund_jobs{state="review"} > 0)
          and on(job, instance) (btcpp_web_business_metrics_collection_success == 1)
          and on(job, instance) (time() - btcpp_web_business_metrics_last_success_timestamp_seconds < 300)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Service refund adjustment delivery needs operator review
          description: Inspect service-refunds and verify the admin decision, original settlement acknowledgment, and earlier refund revisions.
      - alert: BitcoinPlusPlusRefundQueueStalled
        expr: |
          (btcpp_web_service_refund_oldest_pending_timestamp_seconds > 0)
          and (time() - btcpp_web_service_refund_oldest_pending_timestamp_seconds > 900)
          and on(job, instance) (btcpp_web_business_metrics_collection_success == 1)
          and on(job, instance) (time() - btcpp_web_business_metrics_last_success_timestamp_seconds < 300)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Service refund adjustment delivery has been pending for more than fifteen minutes
          description: Inspect service-refunds for missing decisions or blocked ordering, then check SERVICE_FULFILLMENT_ENABLED and receiver availability.
